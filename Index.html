<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Teachers' Day ✏️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--chalk:#f4f1e8;--yellow:#ffe27a;--pink:#ff9fb2;--blue:#8fd3ff;--board:#1b322c}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;overflow-x:hidden;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#2d5148,var(--board) 65%);color:var(--chalk);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:21px;line-height:1.5;overflow-x:hidden}
h1,h2{font-family:'Caveat','Brush Script MT',cursive;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(44px,12vw,84px);color:var(--yellow)}
h2{font-size:clamp(32px,8vw,48px);color:var(--blue)}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl span{position:absolute;bottom:-60px;color:rgba(244,241,232,.16);font-family:'Caveat',cursive;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(260deg)}}
.screen{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 22px;text-align:center}
.screen>*{max-width:560px}
.type{min-height:1.5em}
.typing::after{content:"|";margin-left:2px;color:var(--yellow);animation:bl .6s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;font-size:22px;color:var(--chalk);background:transparent;border:2px dashed var(--chalk);border-radius:14px;padding:10px 24px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:rgba(244,241,232,.12)}button:active{transform:scale(.96)}
button:focus-visible,.frame:focus-within{outline:3px solid var(--yellow);outline-offset:3px}
.frame{position:relative;width:min(260px,70vw);aspect-ratio:4/5;border:6px solid var(--chalk);border-radius:6px;transform:rotate(-2deg);display:grid;place-items:center;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);box-shadow:0 0 0 4px var(--board),0 0 0 6px rgba(244,241,232,.35)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.frame input{position:absolute;inset:0;opacity:0;cursor:pointer}
.frame small{color:rgba(244,241,232,.7)}
.proof{width:100%;text-align:left;border-left:3px solid var(--pink);padding-left:16px}
.step{display:none;margin:8px 0}.step.show{display:block}
.step b{color:var(--yellow);font-weight:400}
.qed{display:none;font-family:'Caveat',cursive;font-size:38px;color:var(--pink);text-align:right}
.qed.show{display:block}
.card{scroll-margin-top:70px;display:none;border:3px solid var(--yellow);border-radius:16px;padding:26px 22px;background:rgba(0,0,0,.18);text-align:left}
.card.show{display:block;animation:pop .5s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sign{font-family:'Caveat',cursive;font-size:34px;color:var(--yellow);text-align:right}
#mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;font-size:18px;padding:6px 14px;background:rgba(27,50,44,.85)}
.bit{position:fixed;z-index:6;pointer-events:none;font-size:26px;transition:transform 1.4s cubic-bezier(.1,.7,.3,1),opacity 1.4s}
@media (max-width:520px){
body{font-size:18px}
.screen{padding:72px 16px 40px;gap:14px}
#s3{justify-content:flex-start;padding-top:90px}
.proof{padding-left:12px}
.qed{font-size:30px}
button{font-size:19px;padding:10px 20px}
#mus{font-size:15px;padding:5px 11px}
.frame{width:62vw}
.card{padding:20px 16px}.sign{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.fl{display:none}.card.show{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="fl" id="fl" aria-hidden="true"></div>
<button id="mus" aria-pressed="false">🎵 Music: off</button>

<section class="screen" id="s1">
  <h1 class="type auto" data-t="Happy Teachers' Day!"></h1>
  <p class="type auto" data-t="This isn't just a greeting. It's a small proof, written for you."></p>
  <button onclick="document.getElementById('s2').scrollIntoView()">Begin ✏️</button>
</section>

  <h2 class="type auto" data-t="To the best maths teacher"></h2>
  <p class="type auto" data-t="You didn't just make us love maths. You taught us lessons about life, and gave us memories we'll keep forever."></p>
</section>

<section class="screen" id="s3">
  <h2>Theorem</h2>
  <div class="proof">
    <div class="step" data-t="Given: Sir is our maths teacher."></div>
    <div class="step" data-t="To prove: Sir is the best teacher ever."></div>
    <div class="step" data-t="Step 1: He made even the hardest chapters feel doable."></div>
    <div class="step" data-t="Step 2: He taught us things no textbook has: patience, honesty, never giving up."></div>
    <div class="step" data-t="Step 3: He gave us memories worth a lifetime."></div>
    <div class="step" data-t="Therefore: teacher + kindness + belief in us = the best."></div>
    <div class="qed">Q.E.D. ∎</div>
  </div>
  <button id="nxt">Next step</button>
</section>

<section class="screen" id="s4">
  <button id="open">💌 Tap for a surprise</button>
  <div class="card" id="card">
    <p class="type" data-t="Dear Sir, thank you for every explanation you repeated without a sigh, every time you believed in us, and every lesson that stayed with us long after the bell."></p>
    <p class="type" data-t="We'll remember the maths, but we'll remember you even more. Wishing you smiles, respect and endless happiness today and always."></p>
    <p class="type sign" data-t="With love and gratitude, Shazma 💛"></p>
  </div>
</section>

<script>
const syms=['π','∑','√','∞','÷','×','+','−','=','∫','Δ','θ','x²','%','∠','a²+b²'];
const fl=document.getElementById('fl');
function spawn(){const s=document.createElement('span'),d=9+Math.random()*10;s.textContent=syms[Math.random()*syms.length|0];s.style.left=Math.random()*95+'%';s.style.fontSize=(20+Math.random()*34)+'px';s.style.animationDuration=d+'s';fl.appendChild(s);setTimeout(()=>s.remove(),d*1000)}
for(let i=0;i<10;i++)setTimeout(spawn,i*300);setInterval(spawn,900);

function type(el,done){if(el.dataset.done)return done&&done();el.dataset.done=1;const t=el.dataset.t;el.textContent='';el.classList.add('typing');let i=0;(function k(){el.textContent=t.slice(0,++i);if(i<t.length)setTimeout(k,26+Math.random()*34);else{el.classList.remove('typing');done&&done()}})()}
function seq(l,i=0){if(i<l.length)type(l[i],()=>seq(l,i+1))}
const io=new IntersectionObserver((es,o)=>es.forEach(e=>{if(e.isIntersecting){seq([...e.target.querySelectorAll('.type.auto')]);o.unobserve(e.target)}}),{threshold:.15});
if('IntersectionObserver' in window){document.querySelectorAll('.screen').forEach(s=>io.observe(s))}else{document.querySelectorAll('.type.auto').forEach(e=>type(e))}

document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const p=document.getElementById('pic');p.src=URL.createObjectURL(f);p.style.display='block';document.getElementById('ph').style.display='none'};

const steps=[...document.querySelectorAll('.step')],qed=document.querySelector('.qed'),nxt=document.getElementById('nxt');let k=0,busy=false;
nxt.onclick=()=>{if(busy)return;if(k<steps.length){busy=true;const s=steps[k++];s.classList.add('show');type(s,()=>{busy=false;if(k===steps.length){qed.classList.add('show');nxt.style.display='none';qed.scrollIntoView({block:'center',behavior:'smooth'})}else nxt.scrollIntoView({block:'center',behavior:'smooth'})})}};

function burst(){const em=['💛','✨','π','∑','🎉','∞','🌟','√'];for(let i=0;i<34;i++){const b=document.createElement('span');b.className='bit';b.textContent=em[i%em.length];b.style.left='50%';b.style.top='55%';document.body.appendChild(b);const a=Math.random()*6.28,r=120+Math.random()*220;requestAnimationFrame(()=>{b.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-80}px) rotate(${Math.random()*360}deg)`;b.style.opacity=0});setTimeout(()=>b.remove(),1500)}}
document.getElementById('open').onclick=function(){this.style.display='none';const c=document.getElementById('card');c.classList.add('show');c.scrollIntoView({block:'start',behavior:'smooth'});burst();seq([...c.querySelectorAll('.type')])};

let ac,tm,on=false,n=0;const mel=[523,659,784,659,587,698,880,698,523,659,784,1047,880,784,659,587];
function note(f){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+1.3);o.start(t);o.stop(t+1.4)}
const mus=document.getElementById('mus');
mus.onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(on){clearInterval(tm)}else{ac.resume();tm=setInterval(()=>note(mel[n++%mel.length]),520)}on=!on;mus.textContent=on?'🎵 Music: on':'🎵 Music: off';mus.setAttribute('aria-pressed',on)};
</script>
